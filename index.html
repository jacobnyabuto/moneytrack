<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyTrack</title>
    <script>
      // Set the saved (or system) theme before React loads, to avoid a white flash
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('moneytrack-theme')
          if (saved) {
            theme = JSON.parse(saved)
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-bs-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
